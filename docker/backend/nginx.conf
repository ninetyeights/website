# Only the explicitly configured host proxy may supply client IP and HTTPS state.
geo $realip_remote_addr $trusted_host_proxy {
    default 0;
    ${HOST_PROXY_IP} 1;
}
map "$trusted_host_proxy:$http_x_forwarded_proto" $external_scheme {
    default $scheme;
    "1:https" https;
}
map $external_scheme $external_https {
    default "";
    https on;
}
set_real_ip_from ${HOST_PROXY_IP};
real_ip_header X-Real-IP;
real_ip_recursive off;
log_format proxy_context '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent proxy_source=$realip_remote_addr '
                         'trusted_proxy=$trusted_host_proxy scheme=$external_scheme';
access_log /dev/stdout proxy_context;

server {
    listen 3000;
    server_name _;
    server_tokens off;
    include /etc/nginx/security-headers.inc;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s;
    # Keep the admin panel and Livewire requests in Laravel on the public origin.
    location ~ ^/(admin(?:/|$)|livewire(?:[-/]|$)|(?:css|js|fonts)/filament/) {
        root /app/public;
        include /etc/nginx/admin-security-headers.inc;
        try_files $uri @laravel_admin;
    }
    location @laravel_admin {
        include /etc/nginx/admin-security-headers.inc;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $external_https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_hide_header X-Powered-By;
    }
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/security/csp-report {
        access_log off;
        client_max_body_size 16k;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 8000;
    server_name _;
    root /app/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    include /etc/nginx/security-headers.inc;
    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /api/security/csp-report {
        access_log off;
        client_max_body_size 16k;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $external_https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_hide_header X-Powered-By;
    }

    location = /index.php {
        include /etc/nginx/admin-security-headers.inc;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $external_https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
